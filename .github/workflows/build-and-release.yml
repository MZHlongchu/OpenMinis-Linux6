name: Build and Release Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_CMAKE: "3.22.1"
  ANDROID_NDK: "28.0.13004108"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

jobs:
  build-release:
    name: Build and release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl tar unzip make gawk sed file

      - name: Install Android SDK commandline tools
        run: |
          mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          cd /tmp
          curl -sL -o cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip -d /tmp/sdk
          mv /tmp/sdk/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK components
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE}" \
            "ndk;${ANDROID_NDK}"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/${ANDROID_NDK}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/${ANDROID_NDK}" >> "$GITHUB_ENV"

      - name: Build PRoot native dependencies
        run: |
          chmod +x deps/build_proot.sh
          ANDROID_NDK_HOME="/usr/local/lib/android/sdk/ndk/${ANDROID_NDK}" bash deps/build_proot.sh

      - name: Prepare Alpine sandbox assets
        run: |
          chmod +x scripts/prepare_android_sandbox.sh
          bash scripts/prepare_android_sandbox.sh

      - name: Prepare Devstack rootfs asset
        run: |
          chmod +x scripts/prepare_devstack_rootfs.sh
          bash scripts/prepare_devstack_rootfs.sh
          if [ -f build/ubuntu-noble-aarch64.tar.gz ]; then
            mkdir -p src/android/app/src/main/assets
            cp build/ubuntu-noble-aarch64.tar.gz src/android/app/src/main/assets/ubuntu-noble-aarch64.tar.gz
          fi

      - name: Assemble release APK
        working-directory: src/android
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK }}
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK
        run: |
          test -s src/android/app/build/outputs/apk/release/app-release.apk
          unzip -l src/android/app/build/outputs/apk/release/app-release.apk | grep -E "libproot|proot-aarch64|alpine-minirootfs" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openminis-devstack-release
          path: src/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/android/app/build/outputs/apk/release/app-release.apk
          body_path: releases/CHANGELOG.md
          generate_release_notes: true
